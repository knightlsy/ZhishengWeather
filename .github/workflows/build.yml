# TIANQI WEATHER TERMINAL // CI
name: Build // ASSEMBLE

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      variant:
        description: '构建变体 (publicRelease / debug)'
        required: false
        default: 'publicRelease'
        type: choice
        options:
          - publicRelease
          - debug

permissions:
  contents: write
  actions: write

jobs:
  assemble:
    name: Assemble ${{ github.event.inputs.variant || 'publicRelease' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout // 检出
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Unit tests // 单元测试
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace
        continue-on-error: true

      - name: Android Lint // 静态检查
        run: ./gradlew lintDebug --no-daemon --stacktrace
        continue-on-error: true

      - name: Assemble public release // 构建公共发布包
        run: ./gradlew assemblePublicRelease --no-daemon --stacktrace

      - name: Rename APK // 按版本重命名产物
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/publicRelease/app-publicRelease.apk \
             "app-publicRelease-v${VERSION}.apk"
          sha256sum "app-publicRelease-v${VERSION}.apk" > "app-publicRelease-v${VERSION}.apk.sha256"
          cat "app-publicRelease-v${VERSION}.apk.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZhishengWeather-publicRelease
          path: app/build/outputs/apk/publicRelease/*.apk
          if-no-files-found: error

      - name: Create Release // tag 推送时自动发布
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app-publicRelease-v*.apk
            app-publicRelease-v*.apk.sha256
          generate_release_notes: true
